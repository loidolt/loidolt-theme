[package]
name = "theme-tauri-example"
version = "0.0.0"
description = "A minimal Tauri 2 app on @loidolt/theme-tauri"
license = "MIT"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary of the same name on Windows.
name = "theme_tauri_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for `@tauri-apps/api/tray`.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# Native open and save dialogs, and reading and writing the files they pick.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
# `deep-link` hands links opened while the app runs (Windows, Linux) to the running instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
# `generate_context!` needs it once tauri.conf.json configures a plugin.
serde_json = "1"
