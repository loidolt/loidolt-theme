name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npm run test:coverage --workspaces --if-present
      - name: Install browser used by end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Verify accessibility and keyboard behavior in Chromium
        run: npm run test:e2e
      - name: Validate publish contents
        run: |
          npm pack --dry-run -w @loidolt/theme-tokens
          npm pack --dry-run -w @loidolt/theme-styles
          npm pack --dry-run -w @loidolt/theme-svelte
          # Pinned so a tool release cannot flip CI red on an untouched repo.
          npx --yes publint@0.3.24 run packages/tokens
          npx --yes publint@0.3.24 run packages/styles
          npx --yes publint@0.3.24 run packages/svelte
      - name: Validate published types
        run: |
          # CSS entrypoints have no types by design, so they are excluded rather than reported.
          npx --yes @arethetypeswrong/cli@0.18.5 --pack packages/tokens \
            --exclude-entrypoints css css/dark css/dark-auto --ignore-rules cjs-resolves-to-esm
          # `internal-resolution-error` is expected: the declarations import `.svelte` files,
          # which only a Svelte-aware resolver can follow. The `bundler` column is the one that
          # matters for consumers, and it stays green.
          npx --yes @arethetypeswrong/cli@0.18.5 --pack packages/svelte \
            --exclude-entrypoints styles.css \
            --ignore-rules cjs-resolves-to-esm internal-resolution-error
