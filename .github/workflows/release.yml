name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Never run two releases at once, and never cancel one part-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Forks inherit the workflow but not the secrets; skip rather than fail on every fork push.
    if: github.repository == 'loidolt/loidolt-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # No `npm run check` here: CI validates this same commit, and `npm run release`
      # rebuilds the packages before publishing.
      # v2 is the line built for @changesets/cli v3; it takes the token from its `github-token`
      # input (default: github.token), not from a GITHUB_TOKEN env var.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
        env:
          # setup-node writes an .npmrc that authenticates with NODE_AUTH_TOKEN; NPM_TOKEN alone
          # leaves the publish unauthenticated and it 401s.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
